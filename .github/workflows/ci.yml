name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Typography lock: the deck renders natural JetBrains Mono metrics and
      # pins runs spacing-only. Glyph-squeezing lengthAdjust is banned.
      - name: No glyph-squeezing text pins
        run: |
          if grep -rn "spacingAndGlyphs" decks/ --include='*.vue' --include='*.ts' --include='*.md'; then
            echo "::error::spacingAndGlyphs found — text pins must be lengthAdjust=spacing only"
            exit 1
          fi

      - name: Test
        run: npm run test

      - name: Build deck
        run: npm run build
